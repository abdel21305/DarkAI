name: Build DarkAI IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:

      # --------------------------------------------------
      # 1. Récupération du projet
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Xcode
      # --------------------------------------------------
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show Xcode version
        run: |
          xcodebuild -version


      # --------------------------------------------------
      # 3. Ajouter FlyingFox au projet Xcode
      # --------------------------------------------------
      - name: Add FlyingFox to Xcode project
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("DarkAI.xcodeproj/project.pbxproj")
          s = path.read_text()

          PACKAGE_ID = "E11111111111111111111111"
          PRODUCT_ID = "E22222222222222222222222"
          BUILD_ID = "E33333333333333333333333"

          # ==================================================
          # PBXBuildFile
          # ==================================================

          start = s.index("/* Begin PBXBuildFile section */")
          end = s.index("/* End PBXBuildFile section */", start)

          section = s[start:end]

          if "/* FlyingFox in Frameworks */" not in section:

              block = f"""    {BUILD_ID} /* FlyingFox in Frameworks */ = {{
              isa = PBXBuildFile;
              productRef = {PRODUCT_ID} /* FlyingFox */;
          }};
          """

              s = s[:end] + block + s[end:]


          # ==================================================
          # PBXFrameworksBuildPhase
          # ==================================================

          start = s.index("/* Begin PBXFrameworksBuildPhase section */")
          end = s.index("/* End PBXFrameworksBuildPhase section */", start)

          section = s[start:end]

          if "/* FlyingFox in Frameworks */" not in section:

              marker = "        files = (\n"

              if marker not in section:
                  raise RuntimeError(
                      "Impossible de trouver la section files de PBXFrameworksBuildPhase"
                  )

              section = section.replace(
                  marker,
                  marker +
                  f"            {BUILD_ID} /* FlyingFox in Frameworks */,\n",
                  1
              )

              s = s[:start] + section + s[end:]


          # ==================================================
          # XCRemoteSwiftPackageReference
          # ==================================================

          start = s.index(
              "/* Begin XCRemoteSwiftPackageReference section */"
          )

          end = s.index(
              "/* End XCRemoteSwiftPackageReference section */",
              start
          )

          section = s[start:end]

          if 'XCRemoteSwiftPackageReference "FlyingFox"' not in section:

              block = f"""    {PACKAGE_ID} /* XCRemoteSwiftPackageReference "FlyingFox" */ = {{
              isa = XCRemoteSwiftPackageReference;
              repositoryURL = "https://github.com/swhitty/FlyingFox.git";
              requirement = {{
                  kind = upToNextMinorVersion;
                  minimumVersion = 0.27.1;
              }};
          }};
          """

              s = s[:end] + block + s[end:]


          # ==================================================
          # PBXProject packageReferences
          # ==================================================

          start = s.index("/* Begin PBXProject section */")
          end = s.index("/* End PBXProject section */", start)

          section = s[start:end]

          if 'XCRemoteSwiftPackageReference "FlyingFox"' not in section:

              marker = "        packageReferences = (\n"

              if marker not in section:
                  raise RuntimeError(
                      "Impossible de trouver packageReferences"
                  )

              section = section.replace(
                  marker,
                  marker +
                  f'            {PACKAGE_ID} /* XCRemoteSwiftPackageReference "FlyingFox" */,\n',
                  1
              )

              s = s[:start] + section + s[end:]


          # ==================================================
          # XCSwiftPackageProductDependency
          # ==================================================

          start = s.index(
              "/* Begin XCSwiftPackageProductDependency section */"
          )

          end = s.index(
              "/* End XCSwiftPackageProductDependency section */",
              start
          )

          section = s[start:end]

          if "/* FlyingFox */ = {" not in section:

              block = f"""    {PRODUCT_ID} /* FlyingFox */ = {{
              isa = XCSwiftPackageProductDependency;
              package = {PACKAGE_ID} /* XCRemoteSwiftPackageReference "FlyingFox" */;
              productName = FlyingFox;
          }};
          """

              s = s[:end] + block + s[end:]


          # ==================================================
          # PBXNativeTarget packageProductDependencies
          # ==================================================

          start = s.index("/* Begin PBXNativeTarget section */")
          end = s.index("/* End PBXNativeTarget section */", start)

          section = s[start:end]

          if f"{PRODUCT_ID} /* FlyingFox */," not in section:

              marker = "        packageProductDependencies = (\n"

              if marker not in section:
                  raise RuntimeError(
                      "Impossible de trouver packageProductDependencies"
                  )

              section = section.replace(
                  marker,
                  marker +
                  f"            {PRODUCT_ID} /* FlyingFox */,\n",
                  1
              )

              s = s[:start] + section + s[end:]


          # ==================================================
          # Sauvegarde
          # ==================================================

          path.write_text(s)

          print("==========================================")
          print("FlyingFox ajouté au projet Xcode")
          print("==========================================")
          PY


      # --------------------------------------------------
      # 4. Vérification du projet
      # --------------------------------------------------
      - name: Validate Xcode project
        run: |
          plutil -lint DarkAI.xcodeproj/project.pbxproj

          echo ""
          echo "=========================================="
          echo "Références FlyingFox"
          echo "=========================================="

          grep -n "FlyingFox" DarkAI.xcodeproj/project.pbxproj

          echo ""
          echo "Projet Xcode valide."


      # --------------------------------------------------
      # 5. Résolution des packages Swift
      # --------------------------------------------------
      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project DarkAI.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/.spm"


      # --------------------------------------------------
      # 6. Construction StableDiffusion
      # --------------------------------------------------
      - name: Build StableDiffusion XCFramework
        run: |
          chmod +x build_sd_ios.sh
          ./build_sd_ios.sh


      # --------------------------------------------------
      # 7. Vérifier StableDiffusion
      # --------------------------------------------------
      - name: Verify StableDiffusion
        run: |
          if [ ! -d "StableDiffusion.xcframework" ]; then
            echo "ERREUR : StableDiffusion.xcframework absent"
            exit 1
          fi

          echo "StableDiffusion.xcframework OK"


      # --------------------------------------------------
      # 8. Compilation DarkAI sans signature
      # --------------------------------------------------
      - name: Build unsigned app
        run: |
          xcodebuild \
            -project DarkAI.xcodeproj \
            -scheme DarkAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$PWD/.spm" \
            SWIFT_CXX_INTEROPERABILITY_MODE=default \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO


      # --------------------------------------------------
      # 9. Création de l'IPA
      # --------------------------------------------------
      - name: Create IPA
        run: |
          rm -rf Payload
          rm -f DarkAI.ipa

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/DarkAI.app \
            Payload/

          zip -r DarkAI.ipa Payload


      # --------------------------------------------------
      # 10. Vérification IPA
      # --------------------------------------------------
      - name: Verify IPA
        run: |
          if [ ! -f "DarkAI.ipa" ]; then
            echo "ERREUR : DarkAI.ipa n'a pas été créée"
            exit 1
          fi

          ls -lh DarkAI.ipa

          echo "=========================================="
          echo "IPA créée avec succès"
          echo "=========================================="


      # --------------------------------------------------
      # 11. Envoyer l'IPA dans les Artifacts GitHub
      # --------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarkAI-IPA
          path: DarkAI.ipa
