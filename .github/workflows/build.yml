name: Build DarkAI IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Add FlyingFox to Xcode project
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("DarkAI.xcodeproj/project.pbxproj")
          s = path.read_text()

          PACKAGE_ID = "E11111111111111111111111"
          PRODUCT_ID = "E22222222222222222222222"
          BUILD_ID = "E33333333333333333333333"

          def section(name):
              begin = f"/* Begin {name} section */"
              end = f"/* End {name} section */"
              a = s.index(begin)
              b = s.index(end, a)
              return a, b

          # --------------------------------------------------
          # PBXBuildFile
          # --------------------------------------------------
          a, b = section("PBXBuildFile")
          part = s[a:b]

          if "/* FlyingFox in Frameworks */" not in part:
              block = (
                  f"    {BUILD_ID} /* FlyingFox in Frameworks */ = {{\n"
                  f"        isa = PBXBuildFile;\n"
                  f"        productRef = {PRODUCT_ID} /* FlyingFox */;\n"
                  f"    }};\n"
              )
              s = s[:b] + block + s[b:]

          # --------------------------------------------------
          # PBXFrameworksBuildPhase
          # --------------------------------------------------
          a, b = section("PBXFrameworksBuildPhase")
          part = s[a:b]

          if "/* FlyingFox in Frameworks */" not in part:
              match = re.search(r"(\bfiles\s*=\s*\(\s*\n)", part)

              if not match:
                  raise RuntimeError(
                      "PBXFrameworksBuildPhase trouvé, mais tableau files introuvable."
                  )

              pos = a + match.end()

              line = (
                  f"            {BUILD_ID} /* FlyingFox in Frameworks */,\n"
              )

              s = s[:pos] + line + s[pos:]

          # --------------------------------------------------
          # XCRemoteSwiftPackageReference
          # --------------------------------------------------
          a, b = section("XCRemoteSwiftPackageReference")
          part = s[a:b]

          if 'XCRemoteSwiftPackageReference "FlyingFox"' not in part:
              block = (
                  f'    {PACKAGE_ID} /* XCRemoteSwiftPackageReference "FlyingFox" */ = {{\n'
                  f"        isa = XCRemoteSwiftPackageReference;\n"
                  f'        repositoryURL = "https://github.com/swhitty/FlyingFox.git";\n'
                  f"        requirement = {{\n"
                  f"            kind = upToNextMajorVersion;\n"
                  f"            minimumVersion = 0.27.1;\n"
                  f"        }};\n"
                  f"    }};\n"
              )

              s = s[:b] + block + s[b:]

          # --------------------------------------------------
          # PBXProject / packageReferences
          # --------------------------------------------------
          a, b = section("PBXProject")
          part = s[a:b]

          if 'XCRemoteSwiftPackageReference "FlyingFox"' not in part:
              match = re.search(
                  r"(\bpackageReferences\s*=\s*\(\s*\n)",
                  part
              )

              if not match:
                  raise RuntimeError(
                      "packageReferences introuvable dans PBXProject."
                  )

              pos = a + match.end()

              line = (
                  f'            {PACKAGE_ID} /* XCRemoteSwiftPackageReference "FlyingFox" */,\n'
              )

              s = s[:pos] + line + s[pos:]

          # --------------------------------------------------
          # XCSwiftPackageProductDependency
          # --------------------------------------------------
          a, b = section("XCSwiftPackageProductDependency")
          part = s[a:b]

          if "/* FlyingFox */ = {" not in part:
              block = (
                  f"    {PRODUCT_ID} /* FlyingFox */ = {{\n"
                  f"        isa = XCSwiftPackageProductDependency;\n"
                  f'        package = {PACKAGE_ID} /* XCRemoteSwiftPackageReference "FlyingFox" */;\n'
                  f"        productName = FlyingFox;\n"
                  f"    }};\n"
              )

              s = s[:b] + block + s[b:]

          # --------------------------------------------------
          # PBXNativeTarget / packageProductDependencies
          # --------------------------------------------------
          a, b = section("PBXNativeTarget")
          part = s[a:b]

          if f"{PRODUCT_ID} /* FlyingFox */," not in part:
              match = re.search(
                  r"(\bpackageProductDependencies\s*=\s*\(\s*\n)",
                  part
              )

              if not match:
                  raise RuntimeError(
                      "packageProductDependencies introuvable."
                  )

              pos = a + match.end()

              line = (
                  f"            {PRODUCT_ID} /* FlyingFox */,\n"
              )

              s = s[:pos] + line + s[pos:]

          path.write_text(s)

          print("FlyingFox ajouté au projet.")
          PY

      - name: Validate Xcode project
        run: |
          plutil -lint DarkAI.xcodeproj/project.pbxproj

          echo "===== FlyingFox ====="
          grep -n "FlyingFox" DarkAI.xcodeproj/project.pbxproj

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project DarkAI.xcodeproj \
            -clonedSourcePackagesDirPath "$PWD/.spm"

      - name: Build StableDiffusion XCFramework
        run: |
          chmod +x build_sd_ios.sh
          ./build_sd_ios.sh

      - name: Verify StableDiffusion
        run: |
          test -d StableDiffusion.xcframework
          echo "StableDiffusion.xcframework OK"

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project DarkAI.xcodeproj \
            -scheme DarkAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath "$PWD/.spm" \
            SWIFT_CXX_INTEROPERABILITY_MODE=default \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Create IPA
        run: |
          rm -rf Payload DarkAI.ipa
          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/DarkAI.app \
            Payload/

          zip -r DarkAI.ipa Payload

      - name: Verify IPA
        run: |
          test -f DarkAI.ipa
          ls -lh DarkAI.ipa
          echo "IPA créée avec succès."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DarkAI-IPA
          path: DarkAI.ipa
